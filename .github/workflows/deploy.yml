name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── مرحله اول: بررسی کیفیت و بیلد ──────────────────────────
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate route types
        run: npx next typegen

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          # بیلد به دیتابیس واقعی نیاز ندارد (صفحات force-dynamic هستند)
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/build_dummy

  # ── مرحله دوم: استقرار خودکار روی سرور (فقط push به main) ──
  deploy:
    name: Deploy to server
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            bash /var/www/nobatesalamat/scripts/deploy.sh
